<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ek Lafz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif+Devanagari:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B1712;
    --ink-2:#221C15;
    --paper:#EDE3D0;
    --paper-dim:#C9BEA8;
    --maroon:#9C3D3D;
    --maroon-bright:#B84B4B;
    --brass:#B8963E;
    --border:#3A3226;
  }

  /* Theme: Midnight */
  body.theme-midnight{
    --ink:#0F1419;
    --ink-2:#151B24;
    --paper:#E8EAED;
    --paper-dim:#A9AFBF;
    --maroon:#4A7BA7;
    --maroon-bright:#6B9AC5;
    --brass:#7DBDD6;
    --border:#1F2A3D;
  }

  /* Theme: Autumn */
  body.theme-autumn{
    --ink:#2B1810;
    --ink-2:#3A2416;
    --paper:#F5EBD9;
    --paper-dim:#D4C4A8;
    --maroon:#C85A3A;
    --maroon-bright:#E07856;
    --brass:#E8A644;
    --border:#4A2F1F;
  }

  /* Theme: Minimalist */
  body.theme-minimal{
    --ink:#1A1A1A;
    --ink-2:#242424;
    --paper:#F5F5F5;
    --paper-dim:#999999;
    --maroon:#555555;
    --maroon-bright:#777777;
    --brass:#888888;
    --border:#333333;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0; padding:0;
    background:var(--ink);
    color:var(--paper);
    font-family:'Cormorant Garamond', serif;
    height:100%;
    overflow-x:hidden;
  }

  /* subtle paper-grain texture */
  body::before{
    content:"";
    position:fixed; inset:0;
    pointer-events:none;
    opacity:0.05;
    background-image:radial-gradient(circle at 1px 1px, #fff 1px, transparent 0);
    background-size:3px 3px;
    z-index:1;
  }

  /* ---------- CONFIG: edit welcome message here ---------- */
  .welcome-title{ }
  .welcome-sub{ }
  /* --------------------------------------------------------- */

  #app{ position:relative; z-index:2; min-height:100vh; }

  /* ===================== AMBIENT BACKGROUND ===================== */
  .ambient{
    position:fixed; inset:0;
    z-index:0;
    pointer-events:none;
    overflow:hidden;
  }
  .ambient span{
    position:absolute;
    width:5px; height:5px;
    border-radius:50%;
    background:var(--brass);
    opacity:0.35;
    filter:blur(0.5px);
    animation:driftUp linear infinite;
  }
  @keyframes driftUp{
    0%{ transform:translateY(0) translateX(0); opacity:0; }
    10%{ opacity:0.4; }
    90%{ opacity:0.25; }
    100%{ transform:translateY(-110vh) translateX(var(--dx,20px)); opacity:0; }
  }
  html::before{
    content:"";
    position:fixed; inset:0;
    z-index:0;
    background:radial-gradient(ellipse at 50% -10%, rgba(184,150,62,0.08) 0%, transparent 55%);
    pointer-events:none;
  }

  /* ===================== WELCOME SCREEN ===================== */
  #welcome{
    position:fixed; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    padding:2rem;
    z-index:10;
    background:var(--ink);
    transition:opacity 1.1s ease, transform 1.1s ease;
  }
  #welcome.leaving{
    opacity:0;
    transform:scale(1.04);
    pointer-events:none;
  }

  #welcome{ overflow:hidden; }

  .glow-orb{
    position:absolute;
    width:420px; height:420px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(184,150,62,0.10) 0%, rgba(184,150,62,0) 70%);
    top:50%; left:50%;
    transform:translate(-50%,-50%) scale(0.6);
    opacity:0;
    animation:orbPulse 2.4s ease forwards;
    pointer-events:none;
  }
  @keyframes orbPulse{
    0%{ opacity:0; transform:translate(-50%,-50%) scale(0.5); }
    100%{ opacity:1; transform:translate(-50%,-50%) scale(1); }
  }

  .corner-flourish{
    position:absolute;
    width:120px; height:120px;
    opacity:0;
    animation:riseIn 1.4s ease forwards;
    animation-delay:0.2s;
  }
  .corner-flourish.tl{ top:2rem; left:2rem; }
  .corner-flourish.br{ bottom:2rem; right:2rem; transform:rotate(180deg); }

  .ink-mark{
    position:relative;
    width:64px; height:64px;
    margin-bottom:1.75rem;
    opacity:0;
    animation:inkbleed 1.6s ease forwards;
  }
  .ink-mark svg{ width:100%; height:100%; }

  @keyframes inkbleed{
    0%{ opacity:0; filter:blur(6px); transform:scale(0.6); }
    60%{ opacity:1; filter:blur(0px); transform:scale(1.05); }
    100%{ opacity:1; transform:scale(1); }
  }

  .flourish-rule{
    width:0;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--brass), transparent);
    margin:0 0 1.75rem;
    animation:ruleGrow 1s ease forwards;
    animation-delay:0.95s;
  }
  @keyframes ruleGrow{
    from{ width:0; opacity:0; }
    to{ width:180px; opacity:1; }
  }

  .brand-label{
    font-family:'Cormorant Garamond', serif;
    font-size:0.8rem;
    letter-spacing:0.35em;
    color:var(--brass);
    opacity:0;
    animation:riseIn 1s ease forwards;
    animation-delay:0.15s;
    margin-bottom:0.9rem;
  }

  #welcome h1{
    font-size:clamp(2rem, 6vw, 3.4rem);
    font-weight:500;
    letter-spacing:0.01em;
    margin:0 0 0.75rem;
    color:var(--paper);
    opacity:0;
    animation:riseIn 1s ease forwards;
    animation-delay:0.4s;
    max-width:14ch;
  }

  #welcome p.sub{
    font-size:clamp(1rem, 2.4vw, 1.25rem);
    font-style:italic;
    color:var(--paper-dim);
    margin:0 0 2.75rem;
    opacity:0;
    animation:riseIn 1s ease forwards;
    animation-delay:0.75s;
    max-width:32ch;
  }

  @keyframes riseIn{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }

  #enterBtn{
    opacity:0;
    animation:riseIn 1s ease forwards;
    animation-delay:1.1s;
    background:none;
    border:1px solid var(--brass);
    color:var(--brass);
    font-family:'Cormorant Garamond', serif;
    font-size:1.05rem;
    letter-spacing:0.08em;
    padding:0.7rem 2.2rem;
    border-radius:2px;
    cursor:pointer;
    transition:background 0.35s ease, color 0.35s ease;
  }
  #enterBtn:hover, #enterBtn:focus-visible{
    background:var(--brass);
    color:var(--ink);
  }

  /* ===================== MAIN VIEW ===================== */
  #main{
    display:none;
    max-width:640px;
    margin:0 auto;
    padding:2.5rem 1.5rem 6rem;
    min-height:100vh;
  }
  #main.visible{ display:block; }

  header.top{
    position:sticky;
    top:0;
    z-index:6;
    display:flex; align-items:center; justify-content:space-between;
    margin:-2.5rem -1.5rem 2.5rem;
    padding:1.25rem 1.5rem;
    background:linear-gradient(to bottom, var(--ink) 60%, transparent);
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    border-bottom:1px solid var(--border);
  }
  header.top .brand{
    display:flex; align-items:center; gap:0.6rem;
  }
  header.top .brand-dot{
    width:8px; height:8px;
    border-radius:50%;
    background:var(--brass);
    box-shadow:0 0 8px 2px color-mix(in srgb, var(--brass) 60%, transparent);
    animation:dotPulse 2.4s ease-in-out infinite;
  }
  @keyframes dotPulse{
    0%,100%{ opacity:0.6; transform:scale(0.9); }
    50%{ opacity:1; transform:scale(1.15); }
  }
  header.top h2{
    font-weight:600;
    font-size:1.5rem;
    letter-spacing:0.03em;
    margin:0;
    color:var(--paper);
    background:linear-gradient(90deg, var(--paper), var(--brass) 120%);
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
  }
  header.top .counter{
    font-size:0.95rem;
    color:var(--paper-dim);
    font-style:italic;
  }

  /* corner toggle button */
  #viewToggle{
    position:fixed;
    top:1.25rem; right:1.25rem;
    z-index:9;
    width:42px; height:42px;
    background:var(--ink-2);
    border:1px solid var(--border);
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    color:var(--brass);
    transition:transform 0.3s ease, border-color 0.3s ease;
  }
  #viewToggle:hover{ border-color:var(--brass); transform:rotate(90deg); }
  #viewToggle svg{ width:18px; height:18px; }

  /* download-as-image button */
  #downloadBtn{
    position:fixed;
    bottom:1.25rem; right:1.25rem;
    z-index:9;
    width:30px; height:30px;
    border-radius:50%;
    background:var(--ink-2);
    border:1px solid var(--border);
    color:var(--brass);
    font-size:0.5rem;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    box-shadow:0 6px 14px -6px rgba(0,0,0,0.6);
    transition:transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
  }
  #downloadBtn:hover{
    border-color:var(--brass);
    transform:scale(1.1);
    box-shadow:0 0 0 6px color-mix(in srgb, var(--brass) 14%, transparent);
  }
  #downloadBtn:active{ transform:scale(0.95); }
  #downloadBtn.busy{ opacity:0.6; pointer-events:none; }

  /* theme toggle menu */
  #themeToggle{
    position:fixed;
    top:1.25rem; right:5.5rem;
    z-index:9;
    width:42px; height:42px;
    background:var(--ink-2);
    border:1px solid var(--border);
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    color:var(--brass);
    font-size:1.1rem;
    transition:transform 0.3s ease;
  }
  #themeToggle:hover{ transform:rotate(180deg); }

  .theme-menu{
    position:fixed;
    top:5.5rem; right:1.25rem;
    z-index:9;
    background:var(--ink-2);
    border:1px solid var(--border);
    border-radius:6px;
    padding:0.5rem 0;
    display:none;
    flex-direction:column;
    gap:0;
    min-width:140px;
  }
  .theme-menu.visible{ display:flex; }
  .theme-item{
    background:none;
    border:none;
    color:var(--paper);
    padding:0.6rem 1rem;
    text-align:left;
    cursor:pointer;
    font-family:'Cormorant Garamond', serif;
    font-size:0.95rem;
    transition:background 0.2s ease;
  }
  .theme-item:hover{ background:var(--border); }
  .theme-item.active{ color:var(--brass); border-left:2px solid var(--brass); padding-left:calc(1rem - 2px); }

  /* ---------- CARD VIEW ---------- */
  #cardView{ }

  .shayari-card{
    position:relative;
    padding:3rem 1.75rem;
    text-align:center;
    min-height:280px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    overflow:hidden;
    background:linear-gradient(160deg, var(--ink-2) 0%, color-mix(in srgb, var(--ink-2) 85%, black) 100%);
    border:1px solid var(--border);
    border-radius:14px;
    box-shadow:
      0 1px 0 rgba(255,255,255,0.03) inset,
      0 20px 40px -20px rgba(0,0,0,0.6),
      0 0 0 1px rgba(0,0,0,0.2);
    animation:cardFloat 6s ease-in-out infinite;
  }
  .shayari-card::marker{ display:none; }
  .shayari-card .top-accent{
    position:absolute; top:0; left:12%; right:12%;
    height:2px;
    background:linear-gradient(90deg, transparent, var(--brass), transparent);
    opacity:0.7;
  }
  @keyframes cardFloat{
    0%,100%{ transform:translateY(0); }
    50%{ transform:translateY(-4px); }
  }
  .shayari-card::before, .shayari-card::after{
    content:"❝";
    position:absolute;
    font-family:'Cormorant Garamond', serif;
    font-size:2.6rem;
    color:var(--brass);
    opacity:0;
    animation:quoteFade 1s ease forwards;
    animation-delay:0.1s;
  }
  .shayari-card::before{ top:0.6rem; left:0.7rem; }
  .shayari-card::after{ content:"❞"; bottom:0.6rem; right:0.7rem; animation-delay:0.3s; }
  @keyframes quoteFade{
    from{ opacity:0; transform:scale(0.6); }
    to{ opacity:0.28; transform:scale(1); }
  }

  /* soft breathing glow behind the card */
  #cardHolder{
    position:relative;
  }
  #cardHolder::before{
    content:"";
    position:absolute;
    inset:-10% -5%;
    background:radial-gradient(ellipse at center, rgba(184,150,62,0.06) 0%, transparent 70%);
    animation:breathe 5s ease-in-out infinite;
    pointer-events:none;
    z-index:-1;
  }
  @keyframes breathe{
    0%, 100%{ opacity:0.5; transform:scale(1); }
    50%{ opacity:1; transform:scale(1.06); }
  }

  .card-inner{ width:100%; }

  /* directional entrance for the whole card */
  .dir-init{ animation:cardInit 0.7s ease; }
  .dir-next{ animation:cardFromRight 0.55s cubic-bezier(.22,.9,.35,1); }
  .dir-prev{ animation:cardFromLeft 0.55s cubic-bezier(.22,.9,.35,1); }

  @keyframes cardInit{
    from{ opacity:0; transform:translateY(18px) scale(0.98); filter:blur(3px); }
    to{ opacity:1; transform:translateY(0) scale(1); filter:blur(0); }
  }
  @keyframes cardFromRight{
    0%{ opacity:0; transform:translateX(36px) rotate(1.5deg); }
    100%{ opacity:1; transform:translateX(0) rotate(0); }
  }
  @keyframes cardFromLeft{
    0%{ opacity:0; transform:translateX(-36px) rotate(-1.5deg); }
    100%{ opacity:1; transform:translateX(0) rotate(0); }
  }

  .shayari-text{
    font-family:'Noto Serif Devanagari', serif;
    font-size:clamp(1.4rem, 3.6vw, 1.85rem);
    line-height:2;
    color:var(--paper);
    margin:0 0 1.75rem;
  }

  /* each line of the shayari fades/rises in on its own beat */
  .text-line{
    display:inline-block;
    opacity:0;
    transform:translateY(10px);
    filter:blur(2px);
    animation:lineReveal 0.6s ease forwards;
  }
  @keyframes lineReveal{
    to{ opacity:1; transform:translateY(0); filter:blur(0); }
  }

  .shayari-author{
    font-size:1rem;
    font-style:italic;
    color:var(--brass);
    margin:0;
    opacity:0;
    animation:authorRise 0.7s ease forwards;
  }
  @keyframes authorRise{
    from{ opacity:0; transform:translateY(8px); letter-spacing:0.2em; }
    to{ opacity:1; transform:translateY(0); letter-spacing:normal; }
  }
  .shayari-author::before{
    content:"";
    display:block;
    width:36px; height:1px;
    background:var(--brass);
    margin:0 auto 0.85rem;
    opacity:0.6;
    animation:ruleGrow 0.6s ease forwards;
    animation-delay:inherit;
  }

  .shayari-tags{
    display:flex; gap:0.5rem; justify-content:center; flex-wrap:wrap;
    margin-top:1.1rem;
  }
  .pill{
    font-size:0.75rem;
    letter-spacing:0.03em;
    padding:0.15rem 0.65rem;
    color:var(--maroon-bright);
    border:1px solid var(--maroon);
    border-radius:20px;
    opacity:0;
    transform:scale(0.7);
    animation:pillPop 0.45s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  @keyframes pillPop{
    to{ opacity:1; transform:scale(1); }
  }

  .nav-row{
    display:flex; align-items:center; justify-content:center; gap:2.25rem;
    margin-top:1.75rem;
  }
  .nav-btn{
    background:var(--ink-2);
    border:1px solid var(--border);
    color:var(--brass);
    cursor:pointer;
    width:48px; height:48px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    transition:transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
  }
  .nav-btn svg{ width:20px; height:20px; }
  .nav-btn:hover:not(:disabled){
    border-color:var(--brass);
    transform:scale(1.08);
    box-shadow:0 0 0 4px color-mix(in srgb, var(--brass) 15%, transparent);
  }
  .nav-btn:active:not(:disabled){ transform:scale(0.95); }
  .nav-btn:disabled{ opacity:0.25; cursor:default; }

  /* ---------- BULK / GRID VIEW ---------- */
  #gridView{ display:none; }
  #gridView.visible{ display:block; }

  .grid-wrap{
    columns:1;
    column-gap:1.25rem;
  }
  @media(min-width:560px){ .grid-wrap{ columns:2; } }

  .grid-item{
    break-inside:avoid;
    margin-bottom:1.25rem;
    padding:1.4rem 1.2rem;
    border:1px solid var(--border);
    border-radius:3px;
    cursor:pointer;
    background:var(--ink-2);
    transition:border-color 0.25s ease, transform 0.25s ease;
    opacity:0;
    animation:riseIn 0.5s ease forwards;
  }
  .grid-item:hover{ border-color:var(--brass); transform:translateY(-2px); }

  .grid-item .g-text{
    font-family:'Noto Serif Devanagari', serif;
    font-size:1.05rem;
    line-height:1.85;
    white-space:pre-line;
    color:var(--paper);
    margin:0 0 0.8rem;
  }
  .grid-item .g-author{
    font-size:0.85rem;
    font-style:italic;
    color:var(--brass);
    margin:0 0 0.5rem;
  }
  .grid-item .g-tags{ display:flex; gap:0.4rem; flex-wrap:wrap; }
  .grid-item .pill{ font-size:0.68rem; padding:0.1rem 0.5rem; }

  /* ---------- states ---------- */
  .state-msg{
    text-align:center;
    color:var(--paper-dim);
    font-style:italic;
    padding:3rem 1rem;
  }

  .skeleton{
    width:100%;
    display:flex; flex-direction:column; align-items:center; gap:1rem;
  }
  .sk-line, .sk-author{
    height:1.1rem;
    border-radius:4px;
    background:linear-gradient(90deg, var(--ink-2) 25%, var(--border) 50%, var(--ink-2) 75%);
    background-size:200% 100%;
    animation:shimmer 1.4s ease-in-out infinite;
  }
  .sk-author{ width:30%; height:0.85rem; margin-top:0.5rem; }
  @keyframes shimmer{
    0%{ background-position:200% 0; }
    100%{ background-position:-200% 0; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.01ms !important; transition-duration:0.01ms !important; }
  }

  @media (max-width:420px){
    #main{ padding-left:1rem; padding-right:1rem; }
    .shayari-card{ padding-left:1.1rem; padding-right:1.1rem; }
    header.top{ margin-left:-1rem; margin-right:-1rem; padding-left:1rem; padding-right:1rem; }
  }
</style>
</head>
<body>

<div id="app">

  <div class="ambient" id="ambient"></div>

  <!-- ============ WELCOME SCREEN ============ -->
  <div id="welcome">
    <div class="glow-orb"></div>
    <svg class="corner-flourish tl" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 4c30 0 40 10 40 40M4 4c0 30 10 40 40 40" stroke="#B8963E" stroke-width="1" opacity="0.5"/>
      <circle cx="4" cy="4" r="2.5" fill="#B8963E" opacity="0.6"/>
    </svg>
    <svg class="corner-flourish br" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 4c30 0 40 10 40 40M4 4c0 30 10 40 40 40" stroke="#B8963E" stroke-width="1" opacity="0.5"/>
      <circle cx="4" cy="4" r="2.5" fill="#B8963E" opacity="0.6"/>
    </svg>
    <div class="ink-mark">
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M32 4C22 16 14 26 14 38a18 18 0 0036 0c0-12-8-22-18-34z" stroke="#B8963E" stroke-width="1.4" fill="none"/>
        <path d="M32 20c-5 7-9 13-9 19a9 9 0 0018 0c0-6-4-12-9-19z" fill="#9C3D3D" opacity="0.85"/>
      </svg>
    </div>
    <h1 class="welcome-title">Ek Lafz</h1>
    <p class="sub welcome-sub">Jo kabhi kah naa ska</p>
    <div class="flourish-rule"></div>
    <button id="enterBtn">Enter</button>
  </div>

  <!-- ============ CORNER TOGGLE ============ -->
  <button id="themeToggle" title="Change theme" aria-label="Theme">🎨</button>
  <div class="theme-menu" id="themeMenu">
    <button class="theme-item active" data-theme="default">Classic</button>
    <button class="theme-item" data-theme="midnight">Midnight</button>
    <button class="theme-item" data-theme="autumn">Autumn</button>
    <button class="theme-item" data-theme="minimal">Minimal</button>
  </div>

  <button id="viewToggle" title="Toggle view" aria-label="Toggle bulk view">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
      <rect x="3" y="3" width="7" height="7" rx="1"/>
      <rect x="14" y="3" width="7" height="7" rx="1"/>
      <rect x="3" y="14" width="7" height="7" rx="1"/>
      <rect x="14" y="14" width="7" height="7" rx="1"/>
    </svg>
  </button>

  <button id="downloadBtn" title="Download as image" aria-label="Download shayari as image">●</button>

  <!-- ============ MAIN ============ -->
  <main id="main">
    <header class="top">
      <div class="brand">
        <span class="brand-dot"></span>
        <h2>Ek Lafz</h2>
      </div>
      <span class="counter" id="counter"></span>
    </header>

    <!-- CARD VIEW -->
    <section id="cardView">
      <div class="shayari-card" id="cardHolder">
        <span class="top-accent"></span>
        <div class="skeleton">
          <div class="sk-line" style="width:70%"></div>
          <div class="sk-line" style="width:55%"></div>
          <div class="sk-line" style="width:40%"></div>
          <div class="sk-author"></div>
        </div>
      </div>
      <div class="nav-row">
        <button class="nav-btn" id="prevBtn" aria-label="Previous">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <button class="nav-btn" id="nextBtn" aria-label="Next">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>

    </section>

    <!-- GRID / BULK VIEW -->
    <section id="gridView">
      <div class="grid-wrap" id="gridWrap"></div>
    </section>
  </main>

</div>

<script>
(function(){
  document.addEventListener('DOMContentLoaded', init);
  if(document.readyState === 'complete' || document.readyState === 'interactive'){
    init();
  }

  function init(){
    if(window.__shayariInited) return;
    window.__shayariInited = true;

    const DATA_URL = "https://raw.githubusercontent.com/kumaranish11/Apps/refs/heads/main/Shayari.json";

  let allShayaris = [];
  let filtered = [];
  let currentIndex = 0;
  let gridMode = false;
  let navDirection = 'init';

  const cardHolder = document.getElementById('cardHolder');
  const counter = document.getElementById('counter');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const gridWrap = document.getElementById('gridWrap');
  const cardView = document.getElementById('cardView');
  const gridView = document.getElementById('gridView');
  const viewToggle = document.getElementById('viewToggle');
  const downloadBtn = document.getElementById('downloadBtn');
  const themeToggle = document.getElementById('themeToggle');
  const themeMenu = document.getElementById('themeMenu');

  // ambient floating particles
  const ambient = document.getElementById('ambient');
  if(ambient){
    const count = 14;
    for(let i=0;i<count;i++){
      const p = document.createElement('span');
      const left = Math.random()*100;
      const dur = 10 + Math.random()*14;
      const delay = Math.random()*14;
      const dx = (Math.random()*60-30) + 'px';
      p.style.left = left + '%';
      p.style.bottom = '-10px';
      p.style.setProperty('--dx', dx);
      p.style.animationDuration = dur + 's';
      p.style.animationDelay = delay + 's';
      ambient.appendChild(p);
    }
  }

  function safeAtob(str){
    try{
      // handle URL-safe base64 and padding issues gracefully
      let s = str.replace(/-/g,'+').replace(/_/g,'/');
      while(s.length % 4){ s += '='; }
      const decoded = decodeURIComponent(escape(window.atob(s)));
      return decoded;
    }catch(e){
      return str; // fallback: show raw text if decode fails
    }
  }

  function renderCard(){
    if(!filtered.length){
      cardHolder.innerHTML = '<p class="state-msg">No shayari available.</p>';
      counter.textContent = '';
      prevBtn.disabled = true; nextBtn.disabled = true;
      return;
    }
    const s = filtered[currentIndex];
    cardHolder.innerHTML = '<span class="top-accent"></span>';

    const wrap = document.createElement('div');
    wrap.className = 'card-inner dir-' + navDirection;

    const lines = s.text.split('\n');
    const textEl = document.createElement('p');
    textEl.className = 'shayari-text';
    textEl.innerHTML = lines.map((line, i) =>
      `<span class="text-line" style="animation-delay:${0.12 + i*0.11}s">${escapeHtml(line) || '&nbsp;'}</span>`
    ).join('<br>');

    const authorEl = document.createElement('p');
    authorEl.className = 'shayari-author';
    authorEl.style.animationDelay = (0.12 + lines.length*0.11 + 0.12) + 's';
    authorEl.textContent = s.author || 'Unknown';

    const tagsEl = document.createElement('div');
    tagsEl.className = 'shayari-tags';
    const tagDelayBase = 0.12 + lines.length*0.11 + 0.32;
    tagsEl.innerHTML = (s.tags||[]).map((t,i) =>
      `<span class="pill" style="animation-delay:${tagDelayBase + i*0.08}s">${escapeHtml(t)}</span>`
    ).join('');

    wrap.appendChild(textEl);
    wrap.appendChild(authorEl);
    wrap.appendChild(tagsEl);
    cardHolder.appendChild(wrap);

    counter.textContent = `${currentIndex+1} / ${filtered.length}`;
    prevBtn.disabled = currentIndex === 0;
    nextBtn.disabled = currentIndex === filtered.length - 1;

    fitCardText(textEl, lines);
  }

  // Shrinks the shayari font just enough that each original line stays
  // on one row, instead of the browser wrapping long lines onto two.
  function fitCardText(textEl, lines, _retries){
    _retries = _retries || 0;
    const apply = () => {
      const cardStyles = getComputedStyle(cardHolder);
      const paddingL = parseFloat(cardStyles.paddingLeft) || 0;
      const paddingR = parseFloat(cardStyles.paddingRight) || 0;
      const available = cardHolder.clientWidth - paddingL - paddingR - 16;

      if(available <= 0){
        // Card isn't laid out yet (e.g. still behind display:none).
        // Try again shortly instead of leaving the default size in place.
        if(_retries < 20){
          setTimeout(() => fitCardText(textEl, lines, _retries + 1), 100);
        }
        return;
      }

      const measureCanvas = fitCardText._canvas || (fitCardText._canvas = document.createElement('canvas'));
      const ctx = measureCanvas.getContext('2d');
      const family = "'Noto Serif Devanagari', serif";
      const maxFont = 30;  // px, ~1.85rem
      const minFont = 14;  // px floor for readability

      let fontSize = maxFont;
      while(fontSize > minFont){
        ctx.font = `${fontSize}px ${family}`;
        let widest = 0;
        for(const line of lines){
          const w = ctx.measureText(line).width;
          if(w > widest) widest = w;
        }
        if(widest <= available) break;
        fontSize -= 1;
      }
      textEl.style.fontSize = fontSize + 'px';
    };

    // Run immediately — don't wait on font loading, which can stall or
    // fail on a flaky connection and leave the text unfixed.
    requestAnimationFrame(apply);

    // Once the real webfont is actually in, re-measure with it — metrics
    // can shift slightly from the fallback serif used above.
    if(document.fonts && document.fonts.ready){
      document.fonts.ready.then(() => requestAnimationFrame(apply)).catch(() => {});
    }
  }

  function renderGrid(){
    gridWrap.innerHTML = '';
    filtered.forEach((s, i) => {
      const item = document.createElement('div');
      item.className = 'grid-item';
      item.style.animationDelay = (Math.min(i,12) * 0.04) + 's';
      item.innerHTML = `
        <p class="g-text">${escapeHtml(s.text)}</p>
        <p class="g-author">${escapeHtml(s.author || 'Unknown')}</p>
        <div class="g-tags">${(s.tags||[]).map(t=>`<span class="pill">${escapeHtml(t)}</span>`).join('')}</div>
      `;
      item.onclick = () => {
        currentIndex = i;
        gridMode = false;
        gridView.classList.remove('visible');
        cardView.style.display = '';
        navDirection = 'init';
        renderCard();
      };
      gridWrap.appendChild(item);
    });
  }

  function escapeHtml(str){
    const d = document.createElement('div');
    d.textContent = str;
    return d.innerHTML;
  }

  prevBtn.onclick = () => { if(currentIndex>0){ currentIndex--; navDirection='prev'; renderCard(); } };
  nextBtn.onclick = () => { if(currentIndex<filtered.length-1){ currentIndex++; navDirection='next'; renderCard(); } };

  document.addEventListener('keydown', (e) => {
    if(gridMode) return;
    if(e.key === 'ArrowRight') nextBtn.click();
    if(e.key === 'ArrowLeft') prevBtn.click();
  });

  themeToggle.onclick = (e) => {
    e.stopPropagation();
    themeMenu.classList.toggle('visible');
  };

  themeMenu.querySelectorAll('.theme-item').forEach(item => {
    item.onclick = () => {
      const theme = item.dataset.theme;
      document.body.className = document.body.className
        .split(' ')
        .filter(c => !c.startsWith('theme-'))
        .join(' ');
      if(theme !== 'default'){
        document.body.classList.add('theme-' + theme);
      }
      themeMenu.querySelectorAll('.theme-item').forEach(i => i.classList.remove('active'));
      item.classList.add('active');
      themeMenu.classList.remove('visible');
    };
  });

  document.addEventListener('click', (e) => {
    if(!themeMenu.contains(e.target) && e.target !== themeToggle){
      themeMenu.classList.remove('visible');
    }
  });

  viewToggle.onclick = () => {
    gridMode = !gridMode;
    if(gridMode){
      cardView.style.display = 'none';
      gridView.classList.add('visible');
      renderGrid();
      downloadBtn.style.display = 'none';
    }else{
      gridView.classList.remove('visible');
      cardView.style.display = '';
      downloadBtn.style.display = '';
    }
  };

  function wrapCanvasText(ctx, text, maxWidth){
    const words = text.split(' ');
    const out = [];
    let line = '';
    for(const word of words){
      const test = line ? line + ' ' + word : word;
      if(ctx.measureText(test).width > maxWidth && line){
        out.push(line);
        line = word;
      } else {
        line = test;
      }
    }
    if(line) out.push(line);
    return out;
  }

  async function downloadShayariImage(){
    if(!filtered.length) return;
    const s = filtered[currentIndex];
    downloadBtn.classList.add('busy');

    try{
      if(document.fonts && document.fonts.ready){
        await document.fonts.ready;
      }
    }catch(e){ /* ignore, canvas will fall back to default fonts */ }

    const css = getComputedStyle(document.body);
    const colInk = css.getPropertyValue('--ink').trim() || '#1B1712';
    const colInk2 = css.getPropertyValue('--ink-2').trim() || '#221C15';
    const colPaper = css.getPropertyValue('--paper').trim() || '#EDE3D0';
    const colBrass = css.getPropertyValue('--brass').trim() || '#B8963E';
    const colMaroon = css.getPropertyValue('--maroon-bright').trim() || '#B84B4B';
    const colBorder = css.getPropertyValue('--border').trim() || '#3A3226';

    const W = 1080, H = 1350;
    const canvas = document.createElement('canvas');
    canvas.width = W; canvas.height = H;
    const ctx = canvas.getContext('2d');

    // background
    const bgGrad = ctx.createLinearGradient(0, 0, W, H);
    bgGrad.addColorStop(0, colInk);
    bgGrad.addColorStop(1, colInk2);
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);

    // panel
    const pad = 70;
    const panelX = pad, panelY = pad * 2.1, panelW = W - pad*2, panelH = H - pad*4.2;
    ctx.save();
    ctx.shadowColor = 'rgba(0,0,0,0.5)';
    ctx.shadowBlur = 50;
    ctx.fillStyle = colInk2;
    roundRect(ctx, panelX, panelY, panelW, panelH, 22);
    ctx.fill();
    ctx.restore();
    ctx.strokeStyle = colBorder;
    ctx.lineWidth = 2;
    roundRect(ctx, panelX, panelY, panelW, panelH, 22);
    ctx.stroke();

    // top accent line
    ctx.strokeStyle = colBrass;
    ctx.globalAlpha = 0.7;
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(panelX + panelW*0.15, panelY);
    ctx.lineTo(panelX + panelW*0.85, panelY);
    ctx.stroke();
    ctx.globalAlpha = 1;

    // quote marks
    ctx.fillStyle = colBrass;
    ctx.globalAlpha = 0.3;
    ctx.font = '64px Georgia, serif';
    ctx.textBaseline = 'top';
    ctx.fillText('\u275D', panelX + 28, panelY + 18);
    ctx.textAlign = 'right';
    ctx.textBaseline = 'bottom';
    ctx.fillText('\u275E', panelX + panelW - 28, panelY + panelH - 18);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
    ctx.globalAlpha = 1;

    // shayari text
    const lines = s.text.split('\n');
    const fontSize = lines.length > 6 ? 40 : 48;
    ctx.font = `${fontSize}px 'Noto Serif Devanagari', serif`;
    ctx.fillStyle = colPaper;
    ctx.textAlign = 'center';
    const maxTextWidth = panelW - 160;

    let wrapped = [];
    lines.forEach(l => {
      if(l.trim() === ''){ wrapped.push(''); return; }
      wrapped = wrapped.concat(wrapCanvasText(ctx, l, maxTextWidth));
    });

    const lineHeight = fontSize * 1.7;
    const textBlockHeight = wrapped.length * lineHeight;
    const authorBlockHeight = 130;
    const tagsBlockHeight = (s.tags && s.tags.length) ? 70 : 0;
    const contentHeight = textBlockHeight + authorBlockHeight + tagsBlockHeight;
    let cursorY = panelY + (panelH - contentHeight) / 2 + fontSize;

    wrapped.forEach(line => {
      ctx.fillText(line, W/2, cursorY);
      cursorY += lineHeight;
    });

    // author rule
    cursorY += 10;
    ctx.strokeStyle = colBrass;
    ctx.globalAlpha = 0.6;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(W/2 - 45, cursorY);
    ctx.lineTo(W/2 + 45, cursorY);
    ctx.stroke();
    ctx.globalAlpha = 1;

    // author name
    cursorY += 46;
    ctx.font = `italic 34px 'Cormorant Garamond', serif`;
    ctx.fillStyle = colBrass;
    ctx.fillText(s.author || 'Unknown', W/2, cursorY);

    // tags
    if(s.tags && s.tags.length){
      cursorY += 56;
      ctx.font = `26px 'Cormorant Garamond', serif`;
      const tagTexts = s.tags.map(t => t);
      const tagWidths = tagTexts.map(t => ctx.measureText(t).width + 36);
      const totalW = tagWidths.reduce((a,b)=>a+b, 0) + (tagTexts.length-1)*14;
      let tx = W/2 - totalW/2;
      tagTexts.forEach((t, i) => {
        const tw = tagWidths[i];
        ctx.strokeStyle = colMaroon;
        ctx.lineWidth = 2;
        roundRect(ctx, tx, cursorY - 34, tw, 44, 22);
        ctx.stroke();
        ctx.fillStyle = colMaroon;
        ctx.textAlign = 'center';
        ctx.fillText(t, tx + tw/2, cursorY - 4);
        tx += tw + 14;
      });
    }

    // watermark
    ctx.font = `600 24px 'Cormorant Garamond', serif`;
    ctx.fillStyle = colBrass;
    ctx.globalAlpha = 0.85;
    ctx.textAlign = 'center';
    ctx.fillText('Ek Lafz', W/2, H - pad*1.3);
    ctx.globalAlpha = 1;

    // trigger download
    canvas.toBlob(blob => {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'ek-lafz-shayari.png';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      downloadBtn.classList.remove('busy');
    }, 'image/png');
  }

  function roundRect(ctx, x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x+r, y);
    ctx.arcTo(x+w, y, x+w, y+h, r);
    ctx.arcTo(x+w, y+h, x, y+h, r);
    ctx.arcTo(x, y+h, x, y, r);
    ctx.arcTo(x, y, x+w, y, r);
    ctx.closePath();
  }

  downloadBtn.onclick = () => { downloadShayariImage(); };

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => {
      const textEl = cardHolder.querySelector('.shayari-text');
      if(textEl && filtered.length){
        fitCardText(textEl, filtered[currentIndex].text.split('\n'));
      }
    }, 150);
  });

  async function loadData(){
    try{
      const res = await fetch(DATA_URL, { cache: "no-store" });
      if(!res.ok) throw new Error('Network response was not ok');
      const raw = await res.json();
      allShayaris = raw.map(item => ({
        text: safeAtob(item.text || ''),
        author: item.author || 'Unknown',
        tags: item.tags || []
      })).filter(s => s.text && s.text.trim().length > 0);

      if(!allShayaris.length){
        cardHolder.innerHTML = '<p class="state-msg">No shayari available yet. Check back soon.</p>';
        return;
      }
      filtered = allShayaris.slice();
      renderCard();
      renderGrid();
    }catch(err){
      cardHolder.innerHTML = '<p class="state-msg">Couldn\'t load shayari right now. Please try again later.</p>';
      console.error(err);
    }
  }

  document.getElementById('enterBtn').addEventListener('click', (e) => {
    const welcome = document.getElementById('welcome');
    const main = document.getElementById('main');
    const rect = e.currentTarget.getBoundingClientRect();
    const cx = rect.left + rect.width/2;
    const cy = rect.top + rect.height/2;
    main.style.clipPath = `circle(0px at ${cx}px ${cy}px)`;
    main.classList.add('visible');
    welcome.classList.add('leaving');

    // The card may have been rendered earlier while #main was still
    // display:none (e.g. data finished loading before Enter was clicked),
    // in which case its width read as 0 and text sizing was skipped.
    // Now that #main is actually laid out, re-fit the current card.
    requestAnimationFrame(() => {
      const textEl = cardHolder.querySelector('.shayari-text');
      if(textEl && filtered.length){
        fitCardText(textEl, filtered[currentIndex].text.split('\n'));
      }
    });

    requestAnimationFrame(() => {
      main.style.transition = 'clip-path 0.9s cubic-bezier(.4,0,.2,1)';
      main.style.clipPath = `circle(150% at ${cx}px ${cy}px)`;
    });
    setTimeout(() => {
      welcome.style.display = 'none';
      main.style.clipPath = '';
      main.style.transition = '';
    }, 950);
  });

  loadData();
  } // end init
})();
</script>

</body>
</html>
